name: Feature / fix (general)
description: Product or UI work with acceptance criteria.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Acceptance:** one line — “Done means …”. Use “N/A — docs-only” if no product check.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What changes and why.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One line (or “N/A — docs-only”).
      placeholder: "Done means: …"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / out of scope (optional)
      description: One line each if helpful.
