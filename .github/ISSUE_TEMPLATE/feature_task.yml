name: Feature / fix (general)
description: UI or product work with Figma frame link and acceptance criteria when applicable.
title: ""
labels: []
body:
  - type: markdown
    attributes:
      value: |
        **Figma:** Share → copy link with **`node-id=`** (frame URL), not file root only.  
        **Acceptance:** one line — “Done means …”. Use “N/A — docs-only” if no product check.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What changes and why.
    validations:
      required: true
  - type: input
    id: figma
    attributes:
      label: Figma frame URL
      description: Required for UI/layout work; use “N/A” if not applicable.
      placeholder: https://www.figma.com/design/...?node-id=...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: One line (or “N/A — docs-only”).
      placeholder: "Done means: …"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / out of scope (optional)
      description: One line each if helpful.
