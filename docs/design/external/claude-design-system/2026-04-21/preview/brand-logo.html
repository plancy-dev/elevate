<!DOCTYPE html>
<html><head>
<style>
@font-face { font-family: 'Geist Mono'; src: url('../fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Geist'; src: url('../fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
</style>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 20px; background: var(--background); font-family: var(--font-sans); display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  .section { }
  .section-title { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); margin-bottom: 10px; }
  .logo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .logo-mark { border-radius: 50%; overflow: hidden; border: 1px solid var(--border-subtle); flex-shrink: 0; }
  .logo-text { font-size: 18px; font-weight: 600; letter-spacing: -0.02em; color: var(--text-primary); }
  .dark-swatch { background: #0d0d0d; padding: 12px 16px; border-radius: 10px; display: flex; align-items: center; gap: 10px; }
  .dark-swatch .logo-text { color: #f4f4f4; }
</style>
</head><body>
<div class="section">
  <div class="section-title">Logomark</div>
  <div class="logo-row">
    <div class="logo-mark" style="width:40px;height:40px">
      <img src="../assets/elevate-mark-192.png" width="40" height="40" style="display:block;object-fit:cover">
    </div>
    <div class="logo-text">Elevate</div>
  </div>
  <div class="logo-row">
    <div class="logo-mark" style="width:28px;height:28px">
      <img src="../assets/elevate-mark-192.png" width="28" height="28" style="display:block;object-fit:cover">
    </div>
    <div class="logo-text" style="font-size:14px">Elevate</div>
  </div>
  <div class="logo-row">
    <div class="logo-mark" style="width:22px;height:22px">
      <img src="../assets/elevate-mark-192.png" width="22" height="22" style="display:block;object-fit:cover">
    </div>
    <div class="logo-text" style="font-size:13px">Elevate</div>
  </div>
</div>

<div class="section">
  <div class="section-title">On Dark</div>
  <div class="dark-swatch">
    <div class="logo-mark" style="width:28px;height:28px;border-color:rgba(255,255,255,0.15)">
      <img src="../assets/elevate-mark-192.png" width="28" height="28" style="display:block;object-fit:cover">
    </div>
    <div class="logo-text" style="font-size:15px">Elevate</div>
  </div>
</div>

<div class="section">
  <div class="section-title">On Marketing Canvas</div>
  <div style="background:#f2f1ed;padding:12px 16px;border-radius:10px;display:flex;align-items:center;gap:10px">
    <div class="logo-mark" style="width:28px;height:28px;border-color:rgba(38,37,30,0.1)">
      <img src="../assets/elevate-mark-192.png" width="28" height="28" style="display:block;object-fit:cover">
    </div>
    <div style="font-size:15px;font-weight:600;letter-spacing:-0.02em;color:#26251e">Elevate</div>
  </div>
</div>

<div class="section">
  <div class="section-title">Wordmark SVG</div>
  <img src="../assets/elevate-wordmark.png" style="height:24px;display:block;margin-bottom:8px">
  <img src="../assets/elevate-wordmark.png" style="height:16px;display:block;filter:opacity(0.5)">
</div>
</body></html>
