<!DOCTYPE html>
<html><head>
<style>
@font-face { font-family: 'Geist Mono'; src: url('../fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Geist'; src: url('../fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
</style>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--background); font-family: var(--font-sans); }
  .section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); margin: 14px 0 8px; }
  .section-title:first-child { margin-top: 0; }
  .field { margin-bottom: 12px; max-width: 300px; }
  .field-label { font-size: 12px; font-weight: 500; color: var(--text-secondary); margin-bottom: 4px; }
  .input { height: 40px; width: 100%; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--field); padding: 0 12px; font-size: 14px; font-family: var(--font-sans); color: var(--text-primary); outline: none; box-sizing: border-box; }
  .input::placeholder { color: var(--text-tertiary); }
  .input:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(15,98,254,0.15); }
  .input-error { border-color: var(--danger); }
  .input-error:focus { box-shadow: 0 0 0 3px rgba(218,30,40,0.15); }
  .hint { font-size: 11px; color: var(--text-tertiary); margin-top: 4px; }
  .hint-error { color: var(--danger); }
  .textarea { width: 100%; border-radius: 10px; border: 1px solid var(--border-subtle); background: var(--field); padding: 8px 12px; font-size: 14px; font-family: var(--font-sans); color: var(--text-primary); outline: none; box-sizing: border-box; resize: vertical; min-height: 72px; }
  .textarea:focus { border-color: var(--focus); box-shadow: 0 0 0 3px rgba(15,98,254,0.15); }
  select.input { cursor: pointer; }
</style>
</head><body>
<div class="section-title">Text Input</div>
<div class="field">
  <div class="field-label">Email address</div>
  <input class="input" type="email" placeholder="you@company.com">
  <div class="hint">We'll never share your email.</div>
</div>

<div class="section-title">Focus State</div>
<div class="field">
  <div class="field-label">Organization name</div>
  <input class="input" type="text" value="Acme Corp" style="border-color:var(--focus);box-shadow:0 0 0 3px rgba(15,98,254,0.15)">
</div>

<div class="section-title">Error State</div>
<div class="field">
  <div class="field-label">Password</div>
  <input class="input input-error" type="password" value="short">
  <div class="hint hint-error">Password must be at least 8 characters.</div>
</div>

<div class="section-title">Textarea</div>
<div class="field">
  <div class="field-label">Message</div>
  <textarea class="textarea" placeholder="Tell us about your team's AI workflow needs…"></textarea>
</div>

<div class="section-title">Select</div>
<div class="field" style="max-width:200px">
  <div class="field-label">Plan</div>
  <select class="input">
    <option>Starter</option>
    <option>Professional</option>
    <option>Enterprise</option>
  </select>
</div>
</body></html>
