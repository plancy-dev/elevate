<!DOCTYPE html>
<html><head>
<style>
@font-face { font-family: 'Geist Mono'; src: url('../fonts/GeistMono-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
@font-face { font-family: 'Geist'; src: url('../fonts/Geist-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
</style>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { margin: 0; padding: 16px; background: var(--background); font-family: var(--font-sans); }
  .section-title { font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-tertiary); margin: 14px 0 8px; }
  .radius-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .r-item { text-align: center; }
  .r-box { background: var(--primary); opacity: 0.85; width: 40px; height: 40px; }
  .r-label { font-size: 9px; font-family: var(--font-mono); color: var(--text-tertiary); margin-top: 4px; }
  .r-val { font-size: 9px; color: var(--text-secondary); }
  .pill-box { background: var(--marketing-accent); height: 32px; width: 80px; display: flex; align-items: center; justify-content: center; }
  .pill-text { font-size: 11px; font-weight: 600; color: white; }
</style>
</head><body>
<div class="section-title">Radius Tokens</div>
<div class="radius-row">
  <div class="r-item">
    <div class="r-box" style="border-radius:4px"></div>
    <div class="r-label">--radius-sm</div>
    <div class="r-val">4px · legacy</div>
  </div>
  <div class="r-item">
    <div class="r-box" style="border-radius:8px"></div>
    <div class="r-label">--radius-md</div>
    <div class="r-val">8px · tabs</div>
  </div>
  <div class="r-item">
    <div class="r-box" style="border-radius:10px"></div>
    <div class="r-label">--radius-lg</div>
    <div class="r-val">10px · buttons/inputs</div>
  </div>
  <div class="r-item">
    <div class="r-box" style="border-radius:12px"></div>
    <div class="r-label">--radius-xl</div>
    <div class="r-val">12px · cards/dialogs</div>
  </div>
  <div class="r-item">
    <div class="pill-box" style="border-radius:9999px">
      <span class="pill-text">Join</span>
    </div>
    <div class="r-label">--radius-pill</div>
    <div class="r-val">9999px · mkt CTA only</div>
  </div>
</div>

<div class="section-title">Semantic Rules</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:6px;font-size:11px;">
  <div style="padding:6px 8px;border-radius:10px;background:var(--layer-01);border:1px solid var(--border-subtle)">App Button → rounded-lg (10px)</div>
  <div style="padding:6px 8px;border-radius:9999px;background:var(--marketing-accent);color:white;font-weight:600;text-align:center">Marketing CTA → pill</div>
  <div style="padding:6px 8px;border-radius:12px;background:var(--layer-01);border:1px solid var(--border-subtle)">Card → rounded-xl (12px)</div>
  <div style="padding:6px 8px;border-radius:10px;background:var(--field);border:1px solid var(--border-subtle);color:var(--text-tertiary)">Input → rounded-lg (10px)</div>
</div>
</body></html>
