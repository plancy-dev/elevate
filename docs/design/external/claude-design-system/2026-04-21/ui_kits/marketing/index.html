  ::-webkit-scrollbar-track{background:transparent}

<div id="root"></div>
<script type="text/babel">

// ── Tokens (marketing chrome) ────────────────────────────────────────────────
const M = {

  ink: '#26251e',
  inkSecondary: '#3f3e38',
  inkTertiary: '#6f6d63',
  accent: '#f54e00',
  accentHover: '#e04400',
  glow: 'rgba(245,78,0,0.12)',
  border: 'rgba(38,37,30,0.10)',

  layer02: '#f4f4f4',

  interactive: '#f54e00',
  textPrimary: '#26251e',
  textSecondary: '#3f3e38',

// ── Page router ───────────────────────────────────────────────────────────────
const pages = ['home', 'blog', 'product', 'pricing'];

// ── Header ────────────────────────────────────────────────────────────────────
const Header = ({ currentPage, onNav }) => {

  const navItems = [

    { id: 'blog', label: 'Blog' },

  ];
  return (
    <header style={{ position:'sticky', top:0, zIndex:50, borderBottom:`1px solid ${M.border}`, background:`rgba(242,241,237,0.9)`, backdropFilter:'blur(12px)' }}>

// ── KPI Preview ───────────────────────────────────────────────────────────────

      </div>
    </div>
  );

    blue: { background:'rgba(15,98,254,0.1)', color:'#0f62fe' },
    green: { background:'rgba(25,128,56,0.1)', color:'#198038' },
  };
  return <span style={{ display:'inline-flex', alignItems:'center', padding:'3px 10px', fontSize:11, fontWeight:600, borderRadius:9999, ...styles[variant] }}>{children}</span>;
};

            <button onClick={() => onNav('blog')} style={{ display:'inline-flex', alignItems:'center', gap:4, marginTop:20, fontSize:14, fontWeight:500, color:M.accent, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit' }}>

const PricingPage = ({ onNav }) => (
  <main>
    <div style={{ maxWidth:1200, margin:'0 auto', padding:'64px 32px' }}>

        <h1 style={{ fontSize:'clamp(1.75rem,1.4rem + 1.2vw,2.25rem)', fontWeight:600, letterSpacing:'-0.02em', color:M.ink }}>Simple, org-scoped pricing</h1>
        <p style={{ fontSize:15, color:M.inkTertiary, marginTop:10 }}>One subscription covers your entire organization.</p>

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:1, border:`1px solid ${M.border}`, background:M.border, maxWidth:860, margin:'0 auto' }}>

          { name:'Enterprise', price:'Custom', per:'', features:['Unlimited members', 'Custom integrations', 'Dedicated CSM', 'SLA + compliance'], cta:'Contact sales', highlight:false },
        ].map(plan => (
          <div key={plan.name} style={{ background:plan.highlight ? '#fff' : M.layer01, padding:'28px 24px', position:'relative' }}>
            {plan.highlight && <div style={{ position:'absolute', top:0, left:0, right:0, height:2, background:M.primary }} />}
            <div style={{ fontSize:13, fontWeight:600, color: plan.highlight ? M.primary : M.inkTertiary, textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:8 }}>{plan.name}</div>
            <div style={{ fontSize:28, fontWeight:700, color:M.ink, letterSpacing:'-0.02em' }}>{plan.price}<span style={{ fontSize:13, fontWeight:400, color:M.inkTertiary }}>{plan.per}</span></div>
            <ul style={{ listStyle:'none', marginTop:20, marginBottom:24, display:'flex', flexDirection:'column', gap:8 }}>
              {plan.features.map(f => (
                <li key={f} style={{ fontSize:13, color:M.inkSecondary, display:'flex', alignItems:'center', gap:6 }}>
                  <svg width={12} height={12} viewBox="0 0 24 24" fill="none" stroke={M.accent} strokeWidth={2.5} strokeLinecap="round" strokeLinejoin="round"><polyline points="20 6 9 17 4 12"/></svg>

            </ul>
            <button onClick={() => onNav('home')} style={{ width:'100%', height:40, fontSize:13, fontWeight:600, background: plan.highlight ? M.primary : 'transparent', color: plan.highlight ? '#fff' : M.inkSecondary, border: plan.highlight ? 'none' : `1px solid ${M.border}`, borderRadius:10, cursor:'pointer', fontFamily:'inherit' }}>

);

// ── Footer ────────────────────────────────────────────────────────────────────
const Footer = ({ onNav }) => (
  <footer style={{ borderTop:`1px solid ${M.border}`, background:M.canvas }}>
    <div style={{ maxWidth:1200, margin:'0 auto', padding:'36px 32px' }}>
      <div style={{ display:'grid', gridTemplateColumns:'1.5fr 1fr 1fr 1fr', gap:32 }}>
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:14 }}>
            <img src="../../assets/elevate-mark-192.png" style={{ width:22, height:22, borderRadius:'50%', objectFit:'cover' }} alt="" />
            <span style={{ fontSize:13, fontWeight:600, letterSpacing:'-0.02em', color:M.ink }}>Elevate</span>
          </div>
          <p style={{ fontSize:12, color:M.inkTertiary, lineHeight:1.6, maxWidth:'22ch' }}>AI adoption & workflow platform for teams.</p>
        </div>
        {[
          { title:'Product', links:[['Prompt Studio','product'],['Ebooks & Guides','blog'],['Pricing','pricing']] },
          { title:'Company', links:[['Blog','blog'],['Waitlist','home'],['Contact','home']] },
          { title:'Legal', links:[['Terms','home'],['Privacy','home'],['Security','home']] },
        ].map(col => (

            <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
              {col.links.map(([label, page]) => (
                <button key={label} onClick={() => onNav(page)} style={{ fontSize:12, color:M.inkTertiary, background:'none', border:'none', cursor:'pointer', fontFamily:'inherit', textAlign:'left', padding:0, transition:'color 100ms' }} onMouseEnter={e=>e.target.style.color=M.ink} onMouseLeave={e=>e.target.style.color=M.inkTertiary}>

      <div style={{ borderTop:`1px solid ${M.border}`, marginTop:28, paddingTop:16, display:'flex', justifyContent:'space-between', alignItems:'center' }}>
        <span style={{ fontSize:11, color:M.inkTertiary }}>© 2026 Elevate. All rights reserved.</span>
        <div style={{ display:'flex', gap:16 }}>
          {['SOC 2 Type II', 'GDPR', 'ISO 27001'].map(b => <span key={b} style={{ fontSize:11, color:M.inkTertiary }}>{b}</span>)}
        </div>
      </div>
    </div>
  </footer>
);

// ── App ───────────────────────────────────────────────────────────────────────
const PAGE_COMPONENTS = { home: HomePage, blog: BlogPage, product: ProductPage, pricing: PricingPage };

function App() {
  const [page, setPage] = React.useState(() => localStorage.getItem('ds-mkt-page') || 'home');
  React.useEffect(() => { localStorage.setItem('ds-mkt-page', page); window.scrollTo(0,0); }, [page]);
  const Page = PAGE_COMPONENTS[page] || HomePage;
  return (
    <div style={{ minHeight:'100vh', display:'flex', flexDirection:'column' }}>
      <Header currentPage={page} onNav={setPage} />
      <div style={{ flex:1 }}>
        <Page onNav={setPage} />
      </div>
      <Footer onNav={setPage} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
