<!--
  Supabase → Invite user
  Subject: You're invited to Elevate
-->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Invitation</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f4f5;font-family:system-ui,-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background-color:#f4f4f5;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background-color:#ffffff;border-radius:12px;border:1px solid #e4e4e7;">
          <tr>
            <td style="padding:28px 28px 8px 28px;">
              <p style="margin:0;font-size:13px;font-weight:600;letter-spacing:0.02em;color:#18181b;">Elevate</p>
              <h1 style="margin:16px 0 0 0;font-size:22px;line-height:1.25;font-weight:600;color:#09090b;">You’re invited</h1>
              <p style="margin:12px 0 0 0;font-size:15px;line-height:1.55;color:#3f3f46;">
                You’ve been invited to join a workspace on Elevate. This invitation is for <strong style="color:#18181b;">{{ .Email }}</strong>.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 8px 28px;">
              <table role="presentation" cellspacing="0" cellpadding="0">
                <tr>
                  <td style="border-radius:8px;background-color:#18181b;">
                    <a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:12px 22px;font-size:15px;font-weight:600;color:#ffffff;text-decoration:none;">Accept invitation</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 24px 28px;">
              <p style="margin:0;font-size:13px;line-height:1.5;color:#71717a;">
                One-time code (if prompted):
              </p>
              <p style="margin:8px 0 0 0;font-size:20px;font-weight:700;letter-spacing:0.2em;color:#18181b;">{{ .Token }}</p>
              <p style="margin:16px 0 0 0;font-size:12px;line-height:1.5;color:#a1a1aa;">
                If you weren’t expecting this, you can ignore this email.
              </p>
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 24px 28px;border-top:1px solid #f4f4f5;">
              <p style="margin:0;font-size:11px;line-height:1.5;color:#a1a1aa;">Elevate Inc. · Invitation for {{ .SiteURL }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
